# ─── Production Profile ───
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:porter}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

server:
  compression:
    enabled: true
    min-response-size: 1024

porter:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY:}
      key-secret: ${RAZORPAY_SECRET:}
